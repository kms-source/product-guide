<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0" />
  <title>제품 교육 가이드</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#07122b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    :root {
      --bg: #f4f6f4;
      --surface: #ffffff;
      --surface-soft: #f8faf8;
      --border: #dce3de;
      --text-main: #18221d;
      --text-sub: #4b5c53;
      --text-muted: #6c7d74;
      --primary: #1b5e4a;
      --primary-dark: #134435;
      --primary-soft: #e6f2ed;
      --accent: #b45309;
      --accent-soft: #fef3c7;
      --shadow: 0 2px 10px rgba(24, 34, 29, 0.06);
      --fs-base: 16px;
      --fs-title: 19px;
      --fs-card-title: 17px;
      --fs-sub: 14px;
      --fs-badge: 12px;
    }

    body.large-text {
      --fs-base: 19px;
      --fs-title: 22px;
      --fs-card-title: 20px;
      --fs-sub: 16px;
      --fs-badge: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: var(--fs-base);
      line-height: 1.5;
      overflow-x: hidden;
    }

    .wrap {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 14px 80px 14px;
    }

    /* 상단 헤더 */
    .header-card {
      background: var(--primary);
      color: #ffffff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(27, 94, 74, 0.18);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .app-title {
      font-size: var(--fs-title);
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1.25;
    }
    .app-sub {
      font-size: 13px;
      color: #d1fae5;
      margin-top: 3px;
    }
    .header-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .h-btn {
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .h-btn.active {
      background: #ffffff;
      color: var(--primary-dark);
      border-color: #ffffff;
    }

    /* 검색창 (DOM 고정으로 한글 입력 깨짐 방지) */
    .search-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 6px 8px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow);
    }
    .search-card:focus-within {
      border-color: var(--primary);
    }
    .search-icon {
      font-size: 18px;
      padding-left: 6px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      height: 42px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: var(--fs-base);
      font-weight: 600;
      outline: none;
      min-width: 0;
    }
    .search-input::placeholder {
      color: #8b9a92;
      font-weight: 500;
    }
    .clear-btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: none;
      background: #e5ece8;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: none;
    }
    .clear-btn.show { display: inline-block; }

    /* 공통 카드 */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: var(--fs-card-title);
      font-weight: 800;
      color: var(--text-main);
    }
    .section-meta {
      font-size: var(--fs-sub);
      font-weight: 700;
      color: var(--primary);
    }

    /* 카테고리 버튼 */
    .cat-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cat-btn {
      min-height: 44px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface-soft);
      color: var(--text-sub);
      font-size: var(--fs-base);
      font-weight: 700;
      cursor: pointer;
    }
    .cat-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    /* 라인 선택 그리드 */
    .line-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .line-card {
      text-align: left;
      padding: 16px 14px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: var(--surface-soft);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 104px;
    }
    .line-card:active {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .line-cat {
      display: inline-block;
      font-size: var(--fs-badge);
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      align-self: flex-start;
    }
    .line-name {
      font-size: var(--fs-card-title);
      font-weight: 800;
      line-height: 1.35;
      word-break: keep-all;
      color: var(--text-main);
    }
    .line-count {
      font-size: var(--fs-sub);
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* 상단 네비게이션 바 */
    .nav-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .nav-btn {
      flex: 1;
      height: 46px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      font-size: var(--fs-base);
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .nav-btn.home {
      flex: 0 0 auto;
      padding: 0 16px;
      background: var(--primary-soft);
      border-color: #b7d8cb;
      color: var(--primary-dark);
    }

    /* 제품 리스트 카드 */
    .prod-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .prod-item {
      width: 100%;
      text-align: left;
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 12px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      cursor: pointer;
    }
    .prod-item:active {
      border-color: var(--primary);
      background: var(--surface-soft);
    }
    .thumb {
      width: 84px;
      height: 84px;
      border-radius: 12px;
      object-fit: cover;
      background: #eef2ef;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .thumb-placeholder {
      width: 84px;
      height: 84px;
      border-radius: 12px;
      background: #eef2ef;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-shrink: 0;
      padding: 6px;
      line-height: 1.3;
    }
    .prod-info { flex: 1; min-width: 0; }
    .prod-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 5px;
    }
    .badge {
      font-size: var(--fs-badge);
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .badge.video {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .prod-name {
      font-size: var(--fs-card-title);
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.35;
      word-break: keep-all;
    }
    .prod-vol {
      font-size: var(--fs-sub);
      font-weight: 700;
      color: var(--text-sub);
      margin-top: 4px;
      line-height: 1.4;
      word-break: keep-all;
    }
    .prod-price {
      font-size: var(--fs-sub);
      font-weight: 800;
      color: var(--primary-dark);
      margin-top: 2px;
      line-height: 1.4;
    }
    .prod-summary {
      font-size: var(--fs-sub);
      color: var(--text-sub);
      margin-top: 5px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 상세 화면 */
    .detail-hero {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }
    .detail-thumb {
      width: 96px;
      height: 96px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #eef2ef;
      flex-shrink: 0;
    }
    .detail-vol {
      font-size: var(--fs-sub);
      font-weight: 700;
      color: var(--text-sub);
      margin-top: 5px;
      line-height: 1.45;
      word-break: keep-all;
    }
    .detail-price {
      font-size: var(--fs-base);
      font-weight: 800;
      color: var(--primary-dark);
      margin-top: 4px;
      line-height: 1.45;
    }
    .summary-box {
      font-size: var(--fs-base);
      color: var(--text-main);
      line-height: 1.6;
      background: var(--surface-soft);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      word-break: keep-all;
    }
    .video-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
    }
    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .sp-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sp-item {
      background: var(--primary-soft);
      border: 1px solid #c6e2d6;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: var(--fs-base);
      font-weight: 600;
      line-height: 1.55;
      color: var(--text-main);
      display: flex;
      gap: 10px;
      align-items: flex-start;
      word-break: keep-all;
    }
    .sp-num {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .detail-img {
      width: 100%;
      display: block;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
      background: #eef2ef;
    }
    .link-btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      background: var(--primary);
      color: #ffffff;
      font-size: var(--fs-base);
      font-weight: 800;
      margin-top: 8px;
    }
    .empty-box {
      text-align: center;
      padding: 30px 14px;
      color: var(--text-sub);
      font-size: var(--fs-base);
      line-height: 1.6;
    }
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: #18221d;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
      display: none;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="wrap">
    <!-- 상단 고정 헤더 -->
    <header class="header-card">
      <div class="header-top">
        <div>
          <div class="app-title">제품 교육 가이드</div>
          <div class="app-sub">카테고리 · 라인별 제품 안내 및 교육 자료</div>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="btnFont" class="h-btn">가+ 글자 크게</button>
        <button type="button" id="btnRefresh" class="h-btn">↻ 새로고침</button>
        <button type="button" id="btnShare" class="h-btn">📤 앱 공유</button>
      </div>
    </header>

    <!-- 고정 검색바 (한글 IME 조합 보호) -->
    <div id="searchCard" class="search-card">
      <span class="search-icon">🔍</span>
      <input id="searchInp" class="search-input" type="search" placeholder="제품명이나 키워드를 입력하세요" autocomplete="off" />
      <button type="button" id="btnClearSearch" class="clear-btn">지우기</button>
    </div>

    <!-- 동적 콘텐츠 영역 -->
    <main id="mainContent"></main>
  </div>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR421CPOCTqRjP5M8FcqTsuSgKXsiTKghCzBl9sl51a2nMmfqhUg4r_hD_Oz1HXeYdz6cwZJpfmHXCt/pub?output=csv';
    const APP_SHARE_URL = 'https://kms-source.github.io/product-guide/';

    const state = {
      loading: true,
      error: '',
      products: [],
      selectedCategory: '전체',
      selectedLine: null,
      selectedProductId: null,
      searchQuery: '',
      largeText: localStorage.getItem('pg_large_text') === '1'
    };

    const toastEl = document.getElementById('toast');
    const searchCardEl = document.getElementById('searchCard');
    const searchInpEl = document.getElementById('searchInp');
    const clearSearchBtnEl = document.getElementById('btnClearSearch');
    const fontBtnEl = document.getElementById('btnFont');
    const mainEl = document.getElementById('mainContent');

    function applyFontMode() {
      document.body.classList.toggle('large-text', state.largeText);
      fontBtnEl.classList.toggle('active', state.largeText);
      fontBtnEl.textContent = state.largeText ? '가- 기본 글씨' : '가+ 글자 크게';
    }
    applyFontMode();

    function notify(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2200);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // RFC 4180 호환 CSV 파서
    function parseCSV(text) {
      const clean = text.replace(/^\uFEFF/, '');
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < clean.length; i++) {
        const ch = clean[i];
        const next = clean[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') {
            field += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            field += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(field);
            field = '';
          } else if (ch === '\r' && next === '\n') {
            row.push(field);
            rows.push(row);
            row = [];
            field = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            row.push(field);
            rows.push(row);
            row = [];
            field = '';
          } else {
            field += ch;
          }
        }
      }
      if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
      }
      return rows;
    }

    function normKey(k) {
      return String(k || '').replace(/\s+/g, '').trim();
    }

    function formatPrice(val) {
      const raw = String(val || '').trim();
      if (!raw) return '';
      if (/원$/.test(raw)) return raw;
      const num = Number(raw.replace(/,/g, ''));
      if (!Number.isNaN(num) && num > 0) {
        return num.toLocaleString('ko-KR') + '원';
      }
      return raw;
    }

    function normalizeImgUrl(url) {
      const u = String(url || '').trim();
      if (!u) return '';
      const m1 = u.match(/drive\.google\.com\/file\/d\/([^\/?#]+)/);
      if (m1) return 'https://drive.google.com/thumbnail?id=' + m1[1] + '&sz=w1200';
      const m2 = u.match(/drive\.google\.com\/open\?id=([^&]+)/);
      if (m2) return 'https://drive.google.com/thumbnail?id=' + m2[1] + '&sz=w1200';
      return u;
    }

    function isLikelyImage(url) {
      const u = String(url || '').trim().toLowerCase();
      if (!u) return false;
      if (/\.(jpg|jpeg|png|webp|gif|bmp|svg)(\?.*)?$/.test(u)) return true;
      if (u.includes('drive.google.com/thumbnail') || u.includes('googleusercontent.com') || u.startsWith('images/') || u.startsWith('./images/')) return true;
      return false;
    }

    function getYoutubeEmbed(url) {
      const u = String(url || '').trim();
      if (!u) return '';
      let id = '';
      const m1 = u.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
      const m2 = u.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
      const m3 = u.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/);
      const m4 = u.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/);
      if (m1) id = m1[1];
      else if (m2) id = m2[1];
      else if (m3) id = m3[1];
      else if (m4) id = m4[1];
      return id ? 'https://www.youtube.com/embed/' + id : '';
    }

    function openProductDetail(prodId, pushHistory = true) {
      state.selectedProductId = prodId;
      if (pushHistory) {
        history.pushState({ view: 'detail', prodId }, '', '#detail-' + encodeURIComponent(prodId));
      }
      window.scrollTo(0, 0);
      renderMain();
    }

    function closeProductDetail(fromPopState = false) {
      if (!state.selectedProductId) return;
      state.selectedProductId = null;
      if (!fromPopState && history.state && history.state.view === 'detail') {
        history.back();
        return;
      }
      window.scrollTo(0, 0);
      renderMain();
    }

    window.addEventListener('popstate', (e) => {
      if (state.selectedProductId) {
        closeProductDetail(true);
      } else if (e.state && e.state.view === 'detail' && e.state.prodId) {
        openProductDetail(e.state.prodId, false);
      }
    });

    async function loadSheetData(showToast) {
      state.loading = true;
      state.error = '';
      renderMain();
      try {
        const res = await fetch(SHEET_CSV_URL + '&_t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('시트 응답 오류 (' + res.status + ')');
        const text = await res.text();
        const rows = parseCSV(text);
        if (rows.length < 2) {
          state.products = [];
          state.loading = false;
          renderMain();
          return;
        }

        const headers = rows[0].map(normKey);
        const getCol = (rowArr, names) => {
          for (const n of names) {
            const idx = headers.indexOf(normKey(n));
            if (idx !== -1 && rowArr[idx] !== undefined) return String(rowArr[idx]).trim();
          }
          return '';
        };

        const list = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || r.every(c => !String(c || '').trim())) continue;

          const visibleRaw = getCol(r, ['노출여부', '노출']).toUpperCase();
          if (['N', 'NO', 'X', '0', '숨김', '미사용'].includes(visibleRaw)) continue;

          const name = getCol(r, ['제품명', '상품명']);
          if (!name) continue;

          const category = getCol(r, ['카테고리', '분류']) || '기타';
          const priceRaw = getCol(r, ['소비자가', '판매가', '가격']);
          const price = formatPrice(priceRaw);
          const composition = getCol(r, ['구성 및 용량', '용량 및 구성', '구성및용량', '용량및구성', '용량', '구성', '규격']);
          const line = getCol(r, ['라인', '제품라인', '브랜드라인']) || category;
          const summary = getCol(r, ['한줄요약', '요약', '설명']);
          const spRaw = getCol(r, ['셀링포인트', '특장점', '포인트']);
          const sellingPoints = spRaw
            .split(/\r?\n|\|/)
            .map(s => s.replace(/^[-•*·]\s*/, '').trim())
            .filter(Boolean);
          const thumb = normalizeImgUrl(getCol(r, ['썸네일', '대표이미지', '이미지']));
          const detailRaw = getCol(r, ['상세이미지', '상세페이지', '상세']);
          const detailItems = detailRaw
            .split(/\r?\n|\|/)
            .map(s => normalizeImgUrl(s))
            .filter(Boolean);
          const videoUrl = getCol(r, ['영상링크', '유튜브', '교육영상', '동영상']);

          list.push({
            id: 'prod_' + i,
            category,
            line,
            name,
            price,
            composition,
            summary,
            sellingPoints,
            thumb,
            detailItems,
            videoUrl,
            embedUrl: getYoutubeEmbed(videoUrl)
          });
        }

        state.products = list;
        state.loading = false;
        renderMain();
        if (showToast) notify('최신 자료를 불러왔습니다 (' + list.length + '개)');
      } catch (err) {
        state.loading = false;
        state.error = '구글 시트를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침을 눌러주세요.';
        renderMain();
      }
    }

    async function shareApp() {
      const txt = '제품 교육 가이드 앱\n' + APP_SHARE_URL;
      try {
        if (navigator.share) {
          await navigator.share({ title: '제품 교육 가이드', text: txt, url: APP_SHARE_URL });
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
      try {
        await navigator.clipboard.writeText(APP_SHARE_URL);
        notify('앱 주소가 복사되었습니다');
      } catch (e) {
        notify('주소 복사에 실패했습니다');
      }
    }

    function renderProductCard(p) {
      const thumbHtml = p.thumb
        ? '<img class="thumb" src="' + escapeHtml(p.thumb) + '" alt="' + escapeHtml(p.name) + '" onerror="this.style.display=\'none\'" />'
        : '<div class="thumb-placeholder">이미지<br>준비중</div>';

      return '<button type="button" class="prod-item" data-open-prod="' + p.id + '">' +
        thumbHtml +
        '<div class="prod-info">' +
        '<div class="prod-badges">' +
        '<span class="badge">' + escapeHtml(p.category) + '</span>' +
        (p.videoUrl ? '<span class="badge video">▶ 교육영상</span>' : '') +
        '</div>' +
        '<div class="prod-name">' + escapeHtml(p.name) + '</div>' +
        (p.composition ? '<div class="prod-vol">구성: ' + escapeHtml(p.composition) + '</div>' : '') +
        (p.price ? '<div class="prod-price">소비자가: ' + escapeHtml(p.price) + '</div>' : '') +
        (p.summary ? '<div class="prod-summary">' + escapeHtml(p.summary) + '</div>' : '') +
        '</div></button>';
    }

    function renderDetail(p) {
      const detailImages = p.detailItems.filter(isLikelyImage);
      const detailLinks = p.detailItems.filter(u => !isLikelyImage(u));

      let videoSection = '';
      if (p.embedUrl) {
        videoSection = '<div class="card">' +
          '<div class="section-head"><span class="section-title">🎬 제품 교육 영상</span></div>' +
          '<div class="video-wrap"><iframe src="' + escapeHtml(p.embedUrl) + '" allowfullscreen></iframe></div>' +
          '</div>';
      } else if (p.videoUrl) {
        videoSection = '<div class="card">' +
          '<div class="section-head"><span class="section-title">🎬 제품 교육 영상</span></div>' +
          '<a class="link-btn" href="' + escapeHtml(p.videoUrl) + '" target="_blank" rel="noopener">교육 영상 보러가기</a>' +
          '</div>';
      }

      const spSection = p.sellingPoints.length
        ? '<div class="card">' +
          '<div class="section-head"><span class="section-title">✨ 핵심 셀링 포인트</span></div>' +
          '<div class="sp-list">' +
          p.sellingPoints.map((pt, i) => '<div class="sp-item"><span class="sp-num">' + (i + 1) + '</span><span>' + escapeHtml(pt) + '</span></div>').join('') +
          '</div></div>'
        : '';

      const detailSection = '<div class="card">' +
        '<div class="section-head"><span class="section-title">📄 상세페이지 안내</span></div>' +
        (detailImages.length
          ? detailImages.map(src => '<img class="detail-img" src="' + escapeHtml(src) + '" alt="상세 이미지" />').join('')
          : '') +
        (detailLinks.length
          ? detailLinks.map((lnk, idx) => '<a class="link-btn" href="' + escapeHtml(lnk) + '" target="_blank" rel="noopener">상세페이지 바로 보기' + (detailLinks.length > 1 ? ' (' + (idx + 1) + ')' : '') + '</a>').join('')
          : '') +
        (!detailImages.length && !detailLinks.length
          ? '<div class="empty-box" style="padding:16px 6px;">등록된 상세 이미지가 없습니다.</div>'
          : '') +
        '</div>';

      return '<div class="nav-bar">' +
        '<button type="button" class="nav-btn" data-act="backFromDetail">← 목록으로 돌아가기</button>' +
        '<button type="button" class="nav-btn home" data-act="goHome">🏠 처음</button>' +
        '</div>' +
        '<div class="card">' +
        '<div class="detail-hero">' +
        (p.thumb
          ? '<img class="detail-thumb" src="' + escapeHtml(p.thumb) + '" alt="' + escapeHtml(p.name) + '" onerror="this.style.display=\'none\'" />'
          : '<div class="thumb-placeholder" style="width:96px;height:96px;">이미지<br>준비중</div>') +
        '<div style="flex:1;min-width:0;">' +
        '<div class="prod-badges"><span class="badge">' + escapeHtml(p.category) + '</span></div>' +
        '<div style="font-size:var(--fs-title);font-weight:800;color:var(--text-main);line-height:1.3;word-break:keep-all;">' + escapeHtml(p.name) + '</div>' +
        (p.composition ? '<div class="detail-vol">구성: ' + escapeHtml(p.composition) + '</div>' : '') +
        (p.price ? '<div class="detail-price">소비자가: ' + escapeHtml(p.price) + '</div>' : '') +
        '</div></div>' +
        (p.summary ? '<div class="summary-box">' + escapeHtml(p.summary) + '</div>' : '') +
        '</div>' +
        videoSection +
        spSection +
        detailSection;
    }

    function renderMain() {
      clearSearchBtnEl.classList.toggle('show', state.searchQuery.length > 0);
      searchCardEl.style.display = state.selectedProductId ? 'none' : 'flex';

      if (state.loading) {
        mainEl.innerHTML = '<div class="card empty-box">제품 자료를 불러오는 중입니다...</div>';
        return;
      }

      if (state.error) {
        mainEl.innerHTML = '<div class="card empty-box">' + escapeHtml(state.error) + '</div>';
        return;
      }

      if (state.products.length === 0) {
        mainEl.innerHTML =
          '<div class="card empty-box">' +
          '<div style="font-weight:800;margin-bottom:8px;">아직 등록된 제품이 없습니다</div>' +
          '구글 시트에 제품을 입력한 뒤 상단 <b>새로고침</b>을 눌러주세요.' +
          '</div>';
        return;
      }

      if (state.selectedProductId) {
        const prod = state.products.find(p => p.id === state.selectedProductId);
        if (prod) {
          mainEl.innerHTML = renderDetail(prod);
          return;
        }
        state.selectedProductId = null;
        searchCardEl.style.display = 'flex';
      }

      const q = state.searchQuery.trim().toLowerCase();
      if (q) {
        const matched = state.products.filter(p =>
          p.name.toLowerCase().includes(q) ||
          p.composition.toLowerCase().includes(q) ||
          p.price.toLowerCase().includes(q) ||
          p.category.toLowerCase().includes(q) ||
          p.summary.toLowerCase().includes(q) ||
          p.sellingPoints.some(s => s.toLowerCase().includes(q))
        );
        mainEl.innerHTML =
          '<div class="card">' +
          '<div class="section-head"><span class="section-title">검색 결과</span><span class="section-meta">' + matched.length + '건</span></div>' +
          (matched.length
            ? '<div class="prod-list">' + matched.map(renderProductCard).join('') + '</div>'
            : '<div class="empty-box">입력하신 내용과 일치하는 제품이 없습니다.</div>') +
          '</div>';
        return;
      }

      if (state.selectedCategory && state.selectedCategory !== '전체') {
        const inCat = state.products.filter(p => p.category === state.selectedCategory);
        mainEl.innerHTML =
          '<div class="nav-bar">' +
          '<button type="button" class="nav-btn home" data-act="goHome">🏠 전체 보기</button>' +
          '</div>' +
          '<div class="card">' +
          '<div class="section-head"><span class="section-title">' + escapeHtml(state.selectedCategory) + '</span><span class="section-meta">' + inCat.length + '개 제품</span></div>' +
          '<div class="prod-list">' + inCat.map(renderProductCard).join('') + '</div>' +
          '</div>';
        return;
      }

      const categories = ['전체', ...new Set(state.products.map(p => p.category))];

      mainEl.innerHTML =
        '<div class="card">' +
        '<div class="section-head"><span class="section-title">카테고리 선택</span><span class="section-meta">전체 ' + state.products.length + '개</span></div>' +
        '<div class="cat-tabs">' +
        categories.map(c => '<button type="button" class="cat-btn' + (state.selectedCategory === c ? ' active' : '') + '" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>').join('') +
        '</div></div>' +
        '<div class="card">' +
        '<div class="section-head"><span class="section-title">전체 제품 목록</span><span class="section-meta">' + state.products.length + '개 제품</span></div>' +
        '<div class="prod-list">' + state.products.map(renderProductCard).join('') + '</div>' +
        '</div>';
    }

    // 고정 헤더 & 검색 이벤트 (1회만 바인딩)
    fontBtnEl.addEventListener('click', () => {
      state.largeText = !state.largeText;
      localStorage.setItem('pg_large_text', state.largeText ? '1' : '0');
      applyFontMode();
      notify(state.largeText ? '큰 글씨 모드가 켜졌습니다' : '기본 글씨 크기로 돌아왔습니다');
    });

    document.getElementById('btnRefresh').addEventListener('click', () => loadSheetData(true));
    document.getElementById('btnShare').addEventListener('click', shareApp);

    searchInpEl.addEventListener('input', e => {
      state.searchQuery = e.target.value;
      renderMain();
    });

    clearSearchBtnEl.addEventListener('click', () => {
      state.searchQuery = '';
      searchInpEl.value = '';
      searchInpEl.focus();
      renderMain();
    });

    // 동적 영역 클릭 이벤트 위임
    mainEl.addEventListener('click', e => {
      const catBtn = e.target.closest('[data-cat]');
      if (catBtn) {
        state.selectedCategory = catBtn.getAttribute('data-cat');
        renderMain();
        return;
      }

      const prodBtn = e.target.closest('[data-open-prod]');
      if (prodBtn) {
        openProductDetail(prodBtn.getAttribute('data-open-prod'), true);
        return;
      }

      const actBtn = e.target.closest('[data-act]');
      if (actBtn) {
        const act = actBtn.getAttribute('data-act');
        if (act === 'backFromDetail') {
          closeProductDetail(false);
        } else if (act === 'goHome') {
          state.selectedProductId = null;
          state.selectedLine = null;
          state.selectedCategory = '전체';
          state.searchQuery = '';
          searchInpEl.value = '';
          if (history.state && history.state.view === 'detail') {
            history.replaceState({ view: 'home' }, '', location.pathname + location.search);
          }
          window.scrollTo(0, 0);
          renderMain();
        }
      }
    });

    loadSheetData(false);
  </script>
</body>
</html>
